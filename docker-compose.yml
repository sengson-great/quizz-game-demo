services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/var/www
    env_file:
    - ./backend/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:WTqheiSSq4dSusbYgAMGELpkFWo5vV+/iWlJ3Tvq94Q=
      APP_URL: http://127.0.0.1:8001
      FRONTEND_URL: http://127.0.0.1:3000
      BROADCAST_CONNECTION: reverb
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: millionaire_quiz
      DB_USERNAME: user
      DB_PASSWORD: password
      REVERB_APP_ID: quizblitz-local
      REVERB_APP_KEY: tfw1crlcln6t1ppggslj
      REVERB_APP_SECRET: quizblitz-local-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8081
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8081
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: millionaire_quiz
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  reverb:
    build: ./backend
    entrypoint: []
    ports:
      - "8081:8081"
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:WTqheiSSq4dSusbYgAMGELpkFWo5vV+/iWlJ3Tvq94Q=
      APP_URL: http://127.0.0.1:8001
      FRONTEND_URL: http://127.0.0.1:3000
      BROADCAST_CONNECTION: reverb
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: millionaire_quiz
      DB_USERNAME: user
      DB_PASSWORD: password
      REVERB_APP_ID: quizblitz-local
      REVERB_APP_KEY: tfw1crlcln6t1ppggslj
      REVERB_APP_SECRET: quizblitz-local-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8081
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8081
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: /api
      VITE_REVERB_APP_KEY: tfw1crlcln6t1ppggslj
      VITE_REVERB_HOST: localhost
      VITE_REVERB_PORT: 8081
      VITE_REVERB_SCHEME: http

volumes:
  db_data:
